name: STSS raw HTTP Eastmoney Tencent probe
on:
  push:
    branches: [market-data-probe-20260929]
    paths: ['.github/workflows/stss-http-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-http:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch historical daily bars directly over HTTP
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse,time
          targets=[("002360","sz",0),("600491","sh",1)]
          out=[]
          for symbol,mkt,sec in targets:
              east="https://push2his.eastmoney.com/api/qt/stock/kline/get?"+urllib.parse.urlencode({
                "secid":str(sec)+"."+symbol,
                "fields1":"f1,f2,f3,f4,f5,f6",
                "fields2":"f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61",
                "klt":101,"fqt":0,"beg":"20260920","end":"20260929"
              })
              tx="https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?"+urllib.parse.urlencode({"param":mkt+symbol+",day,,,20,qfq"})
              d={"ticker":symbol}
              for name,url in [("eastmoney",east),("tencent",tx)]:
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json, text/javascript, */*","Referer":"https://quote.eastmoney.com/" if name=="eastmoney" else "https://gu.qq.com/"})
                      with urllib.request.urlopen(req,timeout=16) as resp:
                          body=resp.read(250000).decode("utf-8",errors="replace")
                          d[name+"_http"]=resp.status
                          payload=json.loads(body)
                      if name=="eastmoney":
                          kl=payload.get("data",{}).get("klines",[]) if payload.get("data") else []
                          d[name+"_bars"]=[{"date":x.split(",")[0],"close":x.split(",")[2]} for x in kl[-5:]]
                          d[name+"_error"]=payload.get("msg") if not kl else None
                      else:
                          info=payload.get("data",{}).get(mkt+symbol,{})
                          kl=info.get("qfqday",info.get("day",[]))
                          d[name+"_bars"]=[{"date":x[0],"close":x[2]} for x in kl[-5:]]
                          d[name+"_code"]=payload.get("code")
                  except Exception as e:
                      d[name+"_error"]=str(e)[:260]
                  time.sleep(.4)
              print("RESULT",json.dumps(d,ensure_ascii=False),flush=True)
              out.append(d)
          n=sum(bool(o.get("eastmoney_bars")) and bool(o.get("tencent_bars")) for o in out)
          print("HTTP_SUMMARY",json.dumps({"double_success":n,"total":len(out),"detail":out},ensure_ascii=False),flush=True)
          with open("http_test_result.json","w") as f:json.dump(out,f)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-test-result
          path: http_test_result.json
          if-no-files-found: warn
