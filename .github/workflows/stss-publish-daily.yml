name: STSS 10-stock cloud daily HTTP pilot
on:
  push:
    branches: [market-data-probe-20260929]
    paths: ['.github/workflows/stss-publish-daily.yml']
  workflow_dispatch:
  schedule:
    - cron: '35 10 * * 1-5'  # 18:35 China Standard Time; cron active only on default branch
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-data-probe-20260929
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch raw Eastmoney/Tencent and publish last COMPLETED A-share session
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, time, urllib.parse, urllib.request
          from pathlib import Path
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          codes = ["000752.SZ", "002360.SZ", "600491.SH", "002168.SZ",
                   "002634.SZ", "300212.SZ", "000610.SZ", "002856.SZ",
                   "002542.SZ", "300205.SZ"]
          def get(url, ref):
              req = urllib.request.Request(
                  url, headers={"User-Agent": "Mozilla/5.0",
                                "Accept": "application/json, text/javascript, */*",
                                "Referer": ref})
              with urllib.request.urlopen(req, timeout=15) as response:
                  return json.loads(response.read(600000).decode("utf-8", "replace"))
          def is_complete(day):
              d = datetime.strptime(day, "%Y-%m-%d").date()
              if d > now.date(): return False
              if d == now.date() and (now.hour, now.minute) < (15, 30): return False
              return True
          def eastmoney(ticker):
              code, market = ticker.split(".")
              secid = ("1" if market == "SH" else "0") + "." + code
              args = urllib.parse.urlencode({
                  "secid": secid, "fields1":"f1,f2,f3,f4,f5,f6",
                  "fields2":"f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61",
                  "klt":101, "fqt":0,
                  "beg":(now - timedelta(days=120)).strftime("%Y%m%d"),
                  "end":now.strftime("%Y%m%d")})
              obj = get("https://push2his.eastmoney.com/api/qt/stock/kline/get?"+args,
                        "https://quote.eastmoney.com/")
              lines = (obj.get("data") or {}).get("klines") or []
              return [{"date":x[0],"close":float(x[2])} for x in
                      (line.split(",") for line in lines) if is_complete(x[0])]
          def tencent(ticker):
              code, market = ticker.split(".")
              symbol = market.lower() + code
              url = ("https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?"
                     + urllib.parse.urlencode({"param":symbol+",day,,,110,qfq"}))
              obj = get(url,"https://gu.qq.com/")
              data = (obj.get("data") or {}).get(symbol) or {}
              lines = data.get("qfqday") or data.get("day") or []
              return [{"date":x[0],"close":float(x[2])} for x in lines
                      if is_complete(x[0])]
          rows=[]
          errors=[]
          stamp=now.strftime("%Y-%m-%d %H:%M:%S%z")
          for ticker in codes:
              em,tx,em_err,tx_err=[],[],None,None
              try: em=eastmoney(ticker)
              except Exception as e: em_err=str(e)[:120]
              time.sleep(.3)
              try: tx=tencent(ticker)
              except Exception as e: tx_err=str(e)[:120]
              e=em[-1] if em else None
              t=tx[-1] if tx else None
              if e and t and e["date"]==t["date"]:
                  if abs(e["close"]-t["close"]) <= .011:
                      rows.append([e["date"],ticker,f'{e["close"]:.3f}',
                                   "Eastmoney_unadjusted",f'{t["close"]:.3f}',
                                   "DUAL_OK",stamp])
                  else:
                      errors.append({"ticker":ticker,"kind":"PRICE_CONFLICT","eastmoney":e,"tencent":t})
              elif e or t:
                  v=e or t
                  rows.append([v["date"],ticker,f'{v["close"]:.3f}',
                               "Eastmoney_unadjusted" if e else "Tencent_qfq",
                               "" if not t or not e else f'{t["close"]:.3f}',
                               "SINGLE_SOURCE",stamp])
              else:
                  errors.append({"ticker":ticker,"kind":"NO_DATA",
                                 "eastmoney_error":em_err,"tencent_error":tx_err})
              print("STOCK", json.dumps({"ticker":ticker,"em_last":e,"tx_last":t,
                  "em_err":em_err,"tx_err":tx_err},ensure_ascii=False),flush=True)
              time.sleep(.3)
          if not rows:
              raise RuntimeError("No valid completed-session bars; retain previous file")
          target=Path("marketdata/stss_latest_10.csv")
          target.parent.mkdir(parents=True,exist_ok=True)
          with target.open("w",newline="",encoding="utf-8") as f:
              w=csv.writer(f)
              w.writerow(["price_date","ticker","close","source","secondary_close","verification","generated_at_cst"])
              w.writerows(rows)
          print("PUBLISH_SUMMARY",json.dumps({"valid":len(rows),"errors":errors,
               "max_date":max(x[0] for x in rows),"generated_at_cst":stamp},ensure_ascii=False),flush=True)
          PY
      - name: Commit cloud-only test output on isolated branch
        shell: bash
        run: |
          git config user.name "stss-market-test[bot]"
          git config user.email "stss-market-test@users.noreply.github.com"
          git add marketdata/stss_latest_10.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: update test daily bars from Eastmoney/Tencent"
            git push origin HEAD:market-data-probe-20260929
          else
            echo "No new data to commit."
          fi
