name: STSS bulk HTTP backfill and 200-distinct-ticker stress
on:
  push:
    branches: [market-data-probe-20260929]
    paths: ['.github/workflows/stss-backfill-stress.yml', 'scripts/stss_cloud_backfill_20260928.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backfill-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-data-probe-20260929
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stock-universe metadata adapter (prices use raw HTTP only)
        run: python -m pip install --disable-pip-version-check baostock
      - name: Backfill all 50 CURRENT_STATE codes and stress-test 200 unique A-share codes
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/stss_cloud_backfill_20260928.py
      - name: Upload evidence regardless of publishing status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stss-historical-backfill-and-stress
          path: |
            marketdata/archive_20260928/
            marketdata/stss_latest_50_20260928.csv
            marketdata/stss_pricing_50_20260928.csv
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified data to isolated test branch
        shell: bash
        run: |
          git config user.name "stss-data-test[bot]"
          git config user.email "stss-data-test@users.noreply.github.com"
          git add marketdata/archive_20260928 marketdata/stss_latest_50_20260928.csv marketdata/stss_pricing_50_20260928.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: backfill full 50-stock raw daily series and 200-stock stress evidence"
            git push origin HEAD:market-data-probe-20260929
          fi
